name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore UniversalQuickPreview.sln

      - name: Build
        run: dotnet build UniversalQuickPreview.sln --configuration Release --no-restore --warnaserror

      - name: Test
        run: dotnet test UniversalQuickPreview.sln --configuration Release --no-build --no-restore

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = "0.1.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download and verify Inno Setup 7.1.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          gh release download is-7_1_0 --repo jrsoftware/issrc --pattern 'innosetup-7.1.0-x64.exe' --dir $env:RUNNER_TEMP
          gh release verify-asset $installer --repo jrsoftware/issrc
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -Wait

      - name: Build portable package and installer
        shell: pwsh
        run: ./build/Publish.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Upload distributable packages
        uses: actions/upload-artifact@v7
        with:
          name: UniversalQuickPreview-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/UniversalQuickPreview-*-portable-win-x64.zip
            artifacts/installer/UniversalQuickPreview-*-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 30
